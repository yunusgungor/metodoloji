# LLM Experiment Runner - Team overrides
# LLM experiment runner: AI experiments
# Bound to Mod A: the experiment loop follows research-methodology

[workflow]
persistent_facts = [
  "file:{project-root}/**/project-context.md",
  "file:{project-root}/docs/bmad/research-methodology.md",
]
activation_steps_append = [
  "Before starting this work, verify the gate rules of the relevant module in the methodology manifesto (docs/bmad/research-methodology.md): the evidence type and record format of the output to be produced.",
  "Create the experiment hypothesis",
  "Set the experiment parameters",
  "Analyze the experiment results"
]
