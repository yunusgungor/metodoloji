# Base config for all BMAD benchmarks
# Inherit via _base_: ../_base_/default.yaml

seed: 42

evaluation:
  sel_env_num: 4
  test_env_num: 4
  eval_test: true

model:
  reasoning_effort: medium

train:
  batch_size: 8
  accumulation: 1
  num_epochs: 3

gradient:
  minibatch_size: 4
  merge_batch_size: 4

optimizer:
  learning_rate: 3
  lr_scheduler: constant
