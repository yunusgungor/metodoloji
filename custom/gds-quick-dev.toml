# Team overrides for gds-quick-dev -- Research methodology (Mod A -> Kod: oyun hizli uygulama).
# This workflow writes code directly. It must load the manifesto and require a
# verified experiment approval before implementing, exactly like bmad-quick-dev.
# Without this, invoking /gds-quick-dev directly would bypass the methodology gate.

[workflow]
persistent_facts = [
  "file:{project-root}/**/project-context.md",
  "file:{project-root}/docs/bmad/research-methodology.md",
  "file:{project-root}/docs/bmad/development-methodology.md",
]
activation_steps_append = [
  "Bu calismayi baslatmadan once metodoloji manifestosundaki (docs/bmad/research-methodology.md) ilgili modun kapi kurallarini dogrula: uretilcek ciktinin kanit turu ve kayit formati.",
  "Calismayi bitirmeden once kaydin eksiksiz oldugunu dogrula: Turkce alan etiketleri, karar gerekcesi, belirsizlik itirafi. Belgesel karar kod yazma izni degildir.",
  "KÖPRÜ: Implementasyon bittikten sonra, docs/bmad/dev-skill-to-methodology-bridge.md §2.3 kuralina gore olusturulmus docs/development/stories/S-<sira>.md kaydinin Durum alanini 'in-progress' → 'review' guncelle ve Dev Agent Record bolumlerini doldur. Hizli kod olsa da metodoloji kayit zincirini (S → QR) korumalisin — kayit disi birakma yok. Native story dosyasini degistirirsen metodoloji kaydini da senkronize et. DOGRULAMA: Story kaydini guncelledikten sonra terminal ile 'ls -la docs/development/stories/S-<sira>.md' komutunu calistir. Dosya yoksa HATA ver ve kaydi yeniden olustur."
]
