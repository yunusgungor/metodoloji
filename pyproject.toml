[project]
name = "metodoloji"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "skillopt>=0.2.0",
    "pyyaml>=6.0",
    "openai>=1.0",
    "httpx>=0.24",
]

[tool.pytest.ini_options]
testpaths = [
    "hooks/engine/tests",
    "bmad_benchmarks/tests",
    "scripts/tests",
    "skills/bmad-architecture/scripts/tests",
    "skills/bmad-brainstorming/scripts/tests",
    "skills/bmad-customize/scripts/tests",
    "skills/bmad-eval-runner/scripts/tests",
    "skills/bmad-forge-idea/scripts/tests",
    "skills/bmad-module-builder/scripts/tests",
    "skills/bmad-party-mode/scripts/tests",
    "skills/bmad-research-experiment/scripts/tests",
    "skills/bmad-workflow-builder/scripts/tests",
]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-q"
