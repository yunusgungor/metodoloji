# Team overrides for bmad-sprint-planning -- Research methodology (Mod D: sprint yonetimi).
# Takim yuzeyi manifestoyu yukler ve kendi modunun belgesel kapisina baglanir.
# Belgesel karar kod yazma izni degildir; kod her durumda Mod A mekanik onayina baglidir.
# Team layer, committed.

[workflow]
persistent_facts = [
  "file:{project-root}/**/project-context.md",
  "file:{project-root}/docs/bmad/research-methodology.md",
  "file:{project-root}/docs/bmad/development-methodology.md",
]
activation_steps_append = [
  "Bu calismayi baslatmadan once metodoloji manifestosundaki (docs/bmad/research-methodology.md) ilgili modun kapi kurallarini dogrula: uretilcek ciktinin kanit turu ve kayit formati.",
  "Calismayi bitirmeden once kaydin eksiksiz oldugunu dogrula: Turkce alan etiketleri, karar gerekcesi, belirsizlik itirafi. Belgesel karar kod yazma izni degildir.",
  "KÖPRÜ: Native sprint-status.yaml ciktisini (_bmad-output/implementation-artifacts/sprint-status.yaml) urettikten sonra, docs/bmad/dev-skill-to-methodology-bridge.md dokümanindaki §2.2 kuralina gore docs/development/SP-<sira>.md metodoloji kaydini olustur. docs/development/_template_SP.md sablonunu kopyala, YAML'den alanlari Turkce etiketlerle doldur (Tarih, Durum: planlandi|devam ediyor|tamamlandı|iptal, Sprint hedefi: tek cumle, Story'ler S-id listesi + oncelik + story points, Kapasite: tahmini points / takim velocity, Blokerler: bilinen blokerler + cozum plani, Bagimliliklar: harici takim/sistem bagimliliklari, Teknik borc). Native YAML'e '# Metodoloji kaydi: docs/development/SP-<sira>.md' yorum referansini ekle. Durum alani izinli degerlerden olmali ve Tarih alani olmali (scripts/check-methodology.sh §6 bunu denetler). Bu, BMED native akisini bozmaz; yanina metodoloji kaydini ekler ve kayit zincirini (IR → SP → S) kurar. DOGRULAMA: Kaydi olusturduktan sonra terminal ile 'ls -la docs/development/SP-<sira>.md' komutunu calistir. Dosya yoksa HATA ver ve kaydi yeniden olustur.",
  "KÖPRÜ (tech-debt cap): SP kaydinda 'Teknik borc' bolumu bos birakilamaz. docs/development/tech-debt.md dosyasindaki '### Kritik Oncelik (P0)' tablosunu oku (python3 -c ile veya dosyayi acarak); tablodaki her TD-XXX ID'si, bu sprint'te ele alinmiyor olsa bile 'Teknik borc' bolumunde 'TD-NNN: <kisa aciklama> - bu sprint kapsami disinda' formatinda referans verilmeli. Eger P0 tablosu bos ise 'Teknik borc: (P0 yok, manifestonun %20 time-box kurali bu sprint icin gecerli degil)' yaz. Bu, manifestonun 'Teknik borc gizlenemez' (manifesto §3.3) kuralini mekanik hale getirir. DOGRULAMA: SP kaydini olusturduktan sonra 'grep -E \"TD-[0-9]+|P0 yok\" docs/development/SP-<sira>.md' komutunu calistir. 0 satir donuyorsa HATA ver ve kaydi yeniden olustur (P0'lar envanterde olmasa bile 'P0 yok' notu zorunlu)."
]
