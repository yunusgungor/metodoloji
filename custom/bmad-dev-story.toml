# Team overrides for bmad-dev-story — Research methodology (Mod A → Kod: story gerçekleme).
# This workflow writes story code directly. It must load the manifesto and require a
# verified experiment approval before implementing, exactly like bmad-agent-dev.
# Without this, invoking /bmad-dev-story directly would bypass the methodology gate.

[workflow]
persistent_facts = [
  "file:{project-root}/**/project-context.md",
  "file:{project-root}/docs/bmad/research-methodology.md",
  "file:{project-root}/docs/bmad/development-methodology.md",
]
activation_steps_prepend = [
  "Confirm the methodology manifesto is loaded: read {project-root}/docs/bmad/research-methodology.md if present. If it is missing, stop and tell the user this workflow requires it.",
]
activation_steps_append = [
  "Before implementing any story, verify its experiment approval: run `python3 {metodoloji-root}/skills/bmad-research-experiment/scripts/run_experiment.py --verify --record {project-root}/docs/experiments/<deney-id>.md` and require the VERIFIED output. FORGED or REDDEDİLDİ means no code — stop and request a valid approved experiment record.",
  "AC DİNAMİK DOĞRULAMA: Story dosyasını yüklerken her Acceptance Criterion'un metadata alanlarını kontrol et: (1) experiment alanı dolu mu? (2) Type alanı tanımlı mı? (3) Measured alanı var mı? (4) Verify alanı var mı? (5) [HYPOTHESIS] etiketi var mı? Hypothesis olarak işaretli AC'leri implementasyondan hariç tut — bu AC'ler için kod yazma, sadece not olarak bırak. Tüm AC'lerin deney onayıyla eşleştiğinden emin olduktan sonra implementasyona başla.",
  "TASK↔AC DİNAMİK DOĞRULAMA: Her Technical Task'ta (AC: AC-XXX) referansı olup olmadığını kontrol et. Eksik referans varsa implementasyon öncesi kullanıcıya bildir ve düzeltilmesini sağla.",
  "DOD DİNAMİK DOĞRULAMA: Her Definition of Done item'ında [DoD-XXX] identifier ve Verify alanı olup olmadığını kontrol et. Eksik alan varsa implementasyon öncesi kullanıcıya bildir.",
  "KÖPRÜ: Implementasyon bittikten sonra, docs/bmad/dev-skill-to-methodology-bridge.md §2.4 kuralina gore olusturulmus docs/development/stories/S-<sira>.md kaydinin Durum alanini 'in-progress' → 'review' guncelle ve Dev Agent Record (Debug Log, Completion Notes, File List, Change Log) bolumlerini doldur. Experiment Refs alanına uygulanan deney sonuçlarını ekle. Bu kayit, siradaki adim olan bmad-code-review'in QR kaydina giden halkasidir (kayit zinciri: S → QR). Native story dosyasini degistirirsen metodoloji kaydini da ayni guncellemeyi yansitacak sekilde senkronize et.",
  "KÖPRÜ #3 (QR): Implementasyon ve DoD dogrulaması tamamlandiktan sonra, docs/bmad/dev-skill-to-methodology-bridge.md §2.5 kuralina gore QR kaydi olustur: docs/quality/QR-<sira>.md dosyasini olustur, her DoD item icin durum/kanit/tarih bilgilerini doldur, story dosyasindaki Quality Record section'ini guncelle. Kayit zinciri: S → QR → PR."
]
