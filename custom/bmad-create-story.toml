# Team overrides for bmad-create-story — Research methodology (Mod C: uygulamaya hazır story dosyası).
# A story is the unit handed to the Kod phase. It must trace to an approved experiment and may
# not invent measurements for its acceptance criteria.
# This workflow is directly invocable (/bmad-create-story), independent of the analyst agent.

[workflow]
persistent_facts = [
  "file:{project-root}/**/project-context.md",
  "file:{project-root}/docs/bmad/research-methodology.md",
  "file:{project-root}/docs/bmad/development-methodology.md",
]
activation_steps_prepend = [
  "Confirm the methodology manifesto is loaded: read {project-root}/docs/bmad/research-methodology.md if present. If it is missing, stop and tell the user this workflow requires it.",
]
activation_steps_append = [
  "Link every story to its experiment record under docs/experiments/ whose status is ONAYLANDI. If a story's acceptance criteria imply a falsifiable claim without a measured, approved experiment, mark that criterion as a hypothesis awaiting experiment — do not assert it as fact.",
  "AC METADATA ZORUNLULUGU: Her Acceptance Criterion icin asagidaki alanlari doldur: [AC-XXX] identifier, Experiment (E-XXX veya —), Type (agent-verifiable|user-evaluable|hybrid), Measured (true|false), Verify (dogrulama yontemi). Eksik metadata = story validate edilemez. Experiment=— olan AC'lerde [HYPOTHESIS] etiketi zorunludur.",
  "TASK↔AC ESLESTIRME: Her Technical Task'ta (AC: AC-XXX) referansi zorunludur. AC referansi olmayan task = validation uyarisi. Guard hook'u bu eslestirmeyi dogrular.",
  "DOD YAPISAL KONTROL: Her Definition of Done item'inda [DoD-XXX] identifier ve Verify alani zorunludur. AC ile iliskili maddelerde AC: AC-XXX referansi gereklidir.",
  "KÖPRÜ: Native story dosyasini ({implementation_artifacts}/<story-key>.md) urettikten sonra, docs/bmad/dev-skill-to-methodology-bridge.md §2.3 kuralina gore docs/development/stories/S-<sira>.md metodoloji kaydini olustur. Sablonu {metodoloji-root}/templates/_template_S.md'den kopyala, native story'den alanlari Turkce etiketlerle doldur (Tarih, Durum: backlog|sprint|in-progress|review|done|blocked, Story basligi, Epic, Sprint referansi, User Story: 'As a [rol], I want [eylem], so that [deger]' formatinda, Acceptance criteria, Technical Tasks: her task (AC: AC-XXX) referansli, Definition of Done: her item [DoD-XXX] + Verify, Bagimliliklar: bu story'ye bagimli / bagimli oldugu S-id'ler, API ve altyapi bagimliliklari, Arastirma girdileri: E/R/D/C-id referanslari, Dosya listesi, Experiment Refs). Native story dosyasina 'Metodoloji kaydi: docs/development/stories/S-<sira>.md' referansini ekle. Her AC icin experiment baglantisini kontrol et: experiment_refs frontmatter'da tanimli mi? Status ONAYLANDI mi? BEKLİYOR veya REDDEDİLDİ olan AC'leri story dosyasinda [HYPOTHESIS] olarak isaretle. Bu, BMED native akisini bozmaz; yanina metodoloji kaydini ekler ve kayit zincirini (SP → S → implementasyon) kurar. DOGRULAMA: Kaydi olusturduktan sonra terminal ile 'ls -la docs/development/stories/S-<sira>.md' komutunu calistir. Dosya yoksa HATA ver ve kaydi yeniden olustur."
]
