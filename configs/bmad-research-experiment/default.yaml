_base_: ../../bmad_benchmarks/envs/_base_/default.yaml

seed: 42

model:
  target: cmc/deepseek/deepseek-v4-flash
  optimizer: cmc/deepseek/deepseek-v4-flash

env:
  name: bmad-research-experiment
  skill_init: bmad_benchmarks/envs/bmad_research_experiment/skills/initial.md
  split_mode: split_dir
  split_dir: bmad_benchmarks/envs/bmad_research_experiment/data
  workers: 2
  max_completion_tokens: 4096
  limit: 0
  out_root: outputs/bmad-research-experiment

train:
  batch_size: 8
  num_epochs: 10
