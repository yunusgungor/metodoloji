# Base config for all BMAD benchmarks
# Inherit via _base_: ../_base_/default.yaml

seed: 42

evaluation:
  # 0 = cover the ENTIRE val/test split. The old default of 4 truncated the
  # first alphabetically-sorted items, so the gate/test never saw the harder
  # items and ReflACT had nothing to optimize (bmad-meta-root lesson). build_eval_batch
  # treats env_num=0 as "no truncation".
  sel_env_num: 0
  test_env_num: 0
  eval_test: true

model:
  reasoning_effort: medium

train:
  batch_size: 8
  accumulation: 1
  num_epochs: 3

gradient:
  minibatch_size: 4
  merge_batch_size: 4
  analyst_workers: 1

optimizer:
  learning_rate: 3
  lr_scheduler: constant
