# Team / enterprise overrides for bmad/config.toml.
# Committed to the repo — applies to every developer on the project.
# Tables deep-merge over base config; keyed entries merge by key.
# Example: override an agent descriptor, or add a new agent.
#
# [agents.bmad-agent-pm]
# description = "Prefers short, bulleted PRDs over narrative drafts."

# --- Hook enforcement modu (Faz 2 hard gate) ---
# OpenHands runtime: guard (PreToolUse) + stop (Stop) fail-closed çalışır —
# onaylı deney kaydı olmadan kod yazımı ve oturum kapanışı DENY döner.
# quality-gate/deploy-guard değerleri burada yalnızca bilgi amaçlıdır (Claude
# runtime kalıntısı; OpenHands hooks.json'ında bağlı değil).
[hooks]
quality_gate = "soft"   # "soft" (varsayılan) | "hard"
deploy_guard = "soft"   # "soft" (varsayılan) | "hard"
