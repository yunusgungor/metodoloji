# Team / enterprise overrides for bmad/config.toml.
# Committed to the repo — applies to every developer on the project.
# Tables deep-merge over base config; keyed entries merge by key.
# Example: override an agent descriptor, or add a new agent.
#
# [agents.bmad-agent-pm]
# description = "Prefers short, bulleted PRDs over narrative drafts."

# --- Artifact paths: point to the target project (NOT the plugin!) ---
# When the plugin is installed, {metodoloji-root} = plugin dir, {project-root} = target repo.
# Methodology outputs (story, experiment, planning, test artifacts) must ALWAYS be
# created in the target repo — never on the plugin.
# This override corrects the wrong {metodoloji-root}/bmad-output paths the installer writes.
[core]
output_folder = "{project-root}/bmad-output"

[modules.bmm]
planning_artifacts = "{project-root}/bmad-output/planning-artifacts"
implementation_artifacts = "{project-root}/bmad-output/implementation-artifacts"
project_knowledge = "{project-root}/docs"

[modules.tea]
test_artifacts = "{project-root}/bmad-output/test-artifacts"
test_design_output = "{project-root}/bmad-output/test-artifacts/test-design"
test_review_output = "{project-root}/bmad-output/test-artifacts/test-reviews"
trace_output = "{project-root}/bmad-output/test-artifacts/traceability"

[modules.gds]
planning_artifacts = "{project-root}/bmad-output/planning-artifacts"
implementation_artifacts = "{project-root}/bmad-output/implementation-artifacts"
project_knowledge = "{project-root}/docs"

[modules.wds]
project_knowledge = "{project-root}/docs"
design_artifacts = "{project-root}/design-artifacts"

# --- Hook enforcement modu ---
# code_guard / stop_guard run fail-closed (default "hard") — code writing and
# session close without an approved experiment record return DENY.
# quality_gate / deploy_guard control the commit & deploy gates:
#   "soft" (default) → warn-only (allow + methodology_warnings), never blocks.
#   "hard"           → DENY on missing IR/QR/SP/PR records.
# Brownfield adoption (existing project, no experiment history yet): set
#   code_guard = "soft"   # unapproved writes warn instead of deny
#   stop_guard = "soft"   # session close never blocked by the record chain
# Tighten back to "hard" once the first VERIFIED experiment scope exists.
# Read live per-call by the hook engine.
[hooks]
quality_gate = "soft"   # "soft" (default) | "hard"
deploy_guard = "soft"   # "soft" (default) | "hard"
code_guard = "hard"     # "hard" (default) | "soft" (brownfield adoption)
stop_guard = "hard"     # "hard" (default) | "soft" (brownfield adoption)
