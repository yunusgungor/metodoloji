_base_: ../../bmad_benchmarks/envs/_base_/default.yaml

seed: 42

# Weak-but-stable model (bmad-meta-root lesson #2/#4): deepseek-v4-flash
# already scores ~100% on these tasks; laguna leaves room for the skill to learn.
# kc/poolside/laguna-s-2.1:free rate-limited mid-training (429); trying the
# cmc gateway's laguna deployment instead (different upstream account limits).
model:
  target: cmc/poolside/laguna-s-2.1-free
  optimizer: cmc/poolside/laguna-s-2.1-free

env:
  name: bmad-code-docs
  skill_init: bmad_benchmarks/envs/bmad_code_docs/skills/initial.md
  out_root: outputs/bmad-code-docs
  limit: 0
  split_mode: split_dir
  split_dir: bmad_benchmarks/envs/bmad_code_docs/data
  max_completion_tokens: 4096
  workers: 2

train:
  batch_size: 3
  num_epochs: 3
