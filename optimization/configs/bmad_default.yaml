# BMAD Methodology SkillOpt Training Config
# Optimizes hook-chain skills for openhands-metodoloji

model:
  backend: openai_compatible
  optimizer: oc/mimo-v2.5-free
  target: oc/mimo-v2.5-free
  optimizer_backend: openai_compatible
  target_backend: openai_compatible

train:
  num_epochs: 3
  batch_size: 10
  accumulation: 2
  seed: 42
  train_size: 45

gradient:
  minibatch_size: 5
  merge_batch_size: 3
  analyst_workers: 2
  failure_only: false

optimizer:
  learning_rate: 6
  min_learning_rate: 2
  lr_scheduler: constant
  lr_control_mode: fixed
  skill_update_mode: patch
  use_slow_update: false
  use_meta_skill: false

evaluation:
  use_gate: true
  gate_metric: hard
  sel_env_num: 15
  test_env_num: 0
  eval_test: true

env:
  name: bmad
  skill_init: skills/bmad-dev-story/SKILL.md
  data_path: optimization/benchmarks/data/all_tasks.jsonl
  split_mode: ratio
  split_ratio: "2:1:7"
  split_seed: 42
  workers: 4
  max_completion_tokens: 4096
  out_root: optimization/output/bmad-dev-story
