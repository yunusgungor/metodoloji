# Team overrides for gds-quick-dev -- Research methodology (Mod A -> Kod: oyun hizli uygulama).
# This workflow writes code directly. It must load the manifesto and require a
# verified experiment approval before implementing, exactly like bmad-quick-dev.
# Without this, invoking /gds-quick-dev directly would bypass the methodology gate.

[workflow]
persistent_facts = [
  "file:{project-root}/**/project-context.md",
  "file:{project-root}/docs/bmad/research-methodology.md",
  "file:{project-root}/docs/bmad/development-methodology.md",
]
activation_steps_append = [
  "Before implementing any feature, verify its experiment approval: run `python3 {metodoloji-root}/skills/bmad-research-experiment/scripts/run_experiment.py --verify --record {project-root}/docs/experiments/<deney-id>.md` and require the VERIFIED output. FORGED or REDDEDİLDİ means no code — stop and request a valid approved experiment record.",
  "Bu calismayi baslatmadan once metodoloji manifestosundaki (docs/bmad/research-methodology.md) ilgili modun kapi kurallarini dogrula: uretilcek ciktinin kanit turu ve kayit formati.",
  "Calismayi bitirmeden once kaydin eksiksiz oldugunu dogrula: Turkce alan etiketleri, karar gerekcesi, belirsizlik itirafi. Belgesel karar kod yazma izni degildir.",
  "KÖPRÜ: Implementasyon bittikten sonra, docs/bmad/dev-skill-to-methodology-bridge.md §2.3 kuralina gore olusturulmus docs/development/stories/S-<sira>.md kaydinin Durum alanini 'in-progress' → 'review' guncelle ve Dev Agent Record bolumlerini doldur. Hizli kod olsa da metodoloji kayit zincirini (S → QR → PR) korumalisin — kayit disi birakma yok. Native story dosyasini degistirirsen metodoloji kaydini da senkronize et. DOGRULAMA: Story kaydini guncelledikten sonra terminal ile 'ls -la docs/development/stories/S-<sira>.md' komutunu calistir. Dosya yoksa HATA ver ve kaydi yeniden olustur.",
  "KÖPRÜ (QR): DoD dogrulamasi tamamlandiktan sonra docs/quality/QR-<sira>.md kaydi olustur (bridge §2.5): her DoD item icin durum/kanit/tarih, story'deki Quality Record bolumunu guncelle. DOGRULAMA: 'ls -la docs/quality/QR-<sira>.md' calistir, yoksa HATA ver.",
  "KÖPRÜ (PR): Deploy oncesi docs/development/PR-<sira>.md production readiness kaydi olustur (bridge §2.6): docs/development/_template_PR.md sablonunu kopyala, Turkce etiketlerle doldur (Tarih, Durum: hazirlaniyor|HAZIR|BEKLIYOR, Release tipi, Versiyon, Release kapsami: QR-id listesi, Staging Test, Rollback Plani, Monitoring, Feature Flags, Runbook, Incident Response, Karar: HAZIR|BEKLIYOR + gerekce, Sonraki adim: production deploy|eksikleri tamamla). Karar izinli degerlerden, Tarih zorunlu (check-methodology §6). Kayit zinciri QR → PR tamamlanir, deploy guard Kapı 4 zorlamasini karsilar. DOGRULAMA: 'ls -la docs/development/PR-<sira>.md' calistir, yoksa HATA ver."
]
