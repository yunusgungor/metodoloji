# Team overrides for gds-create-story -- Research methodology (Mod C: oyun story uretimi).
# A story is the unit handed to the Kod phase. It must trace to an approved experiment and may
# not invent measurements for its acceptance criteria.

[workflow]
persistent_facts = [
  "file:{project-root}/**/project-context.md",
  "file:{project-root}/docs/bmad/research-methodology.md",
  "file:{project-root}/docs/bmad/development-methodology.md",
]
activation_steps_append = [
  "Bu calismayi baslatmadan once metodoloji manifestosundaki (docs/bmad/research-methodology.md) ilgili modun kapi kurallarini dogrula: uretilcek ciktinin kanit turu ve kayit formati.",
  "Calismayi bitirmeden once kaydin eksiksiz oldugunu dogrula: Turkce alan etiketleri, karar gerekcesi, belirsizlik itirafi. Belgesel karar kod yazma izni degildir.",
  "KÖPRÜ: Native story dosyasini urettikten sonra, docs/bmad/dev-skill-to-methodology-bridge.md §2.3 kuralina gore docs/development/stories/S-<sira>.md metodoloji kaydini olustur. Sablonu {metodoloji-root}/docs/development/_template_S.md'den kopyala, native story'den alanlari Turkce etiketlerle doldur (Tarih, Durum: backlog|sprint|in-progress|review|done|blocked, Story basligi, Epic, Acceptance criteria, Experiment Refs, Dosya listesi, Sprint referansi). Native story dosyasina 'Metodoloji kaydi: docs/development/stories/S-<sira>.md' referansini ekle. Her AC icin experiment baglantisini kontrol et: experiment_refs frontmatter'da tanimli mi? Status ONAYLANDI mi? BEKLİYOR veya REDDEDİLDİ olan AC'leri story dosyasinda [HYPOTHESIS] olarak isaretle. Bu, native akisi bozmaz; yanina metodoloji kaydini ekler ve kayit zincirini (SP → S → implementasyon) kurar. DOGRULAMA: Kaydi olusturduktan sonra terminal ile 'ls -la docs/development/stories/S-<sira>.md' komutunu calistir. Dosya yoksa HATA ver ve kaydi yeniden olustur."
]
