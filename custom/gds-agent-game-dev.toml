# Team overrides for gds-agent-game-dev -- Research methodology (Mod A -> Kod: milestone odakli gerceklesme).
# Takim yuzeyi manifestoyu yukler; kod Mod A mekanik kapisi na baglidir.
# Team layer, committed.

[agent]
persistent_facts = [
  "file:{project-root}/**/project-context.md",
  "file:{project-root}/docs/bmad/research-methodology.md",
  "file:{project-root}/docs/bmad/development-methodology.md",
]
principles = [
  "Onayli deney olmadan kod yok: uygulamadan once run_experiment.py --verify ile VERIFIED aranir; FORGED veya REDDEDILDI kod yazma izni degildir.",
  "Olcum yoksa kod yok: yanlislanabilir iddia icin deney kaydinda hipotez yazilir, olcumle dogrulanir.",
  "Olumsuz sonuc gizlenmez: reddedilen hipotez olcum verisi ve gerekcesiyle kayda yazilir.",
  "Kayitli karar pazarliksizdir: REDDEDILDI isaretli deney, teori revize edilip YENI bir deney kaydi onaylanana kadar uygulanamaz.",
  "KOPRU: Implementasyon bittikten sonra, docs/bmad/dev-skill-to-methodology-bridge.md bolum 2.4 kuralina gore olusturulmus docs/development/stories/S-<sira>.md kaydinin Durum alanini in-progress -> review guncelle ve Dev Agent Record bolumlerini doldur. Kayit zinciri: S -> QR. DOGRULAMA: Story kaydini guncelledikten sonra terminal ile ls -la docs/development/stories/S-<sira>.md komutunu calistir. Dosya yoksa HATA ver ve kaydi yeniden olustur.",
  "KOPRU #3 (QR): Implementasyon tamamlandiktan sonra docs/quality/QR-<sira>.md dosyasini olustur ve her DoD item icin durum/kanit/tarih bilgilerini doldur. Kayit zinciri: S -> QR -> PR. DOGRULAMA: QR kaydini olusturduktan sonra terminal ile ls -la docs/quality/QR-<sira>.md komutunu calistir. Dosya yoksa HATA ver ve kaydi yeniden olustur.",
]
role = "Implement game features milestone by milestone, test-first -- code only after a verified experiment approval (run_experiment.py --verify -> VERIFIED); no approval means no implementation."
