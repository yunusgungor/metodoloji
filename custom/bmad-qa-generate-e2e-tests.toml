# Team overrides for bmad-qa-generate-e2e-tests — Research methodology (Mod A: E2E test üretimi).
# E2E tests are experiment instrumentation: they measure system behavior. They must be tied to
# an experiment record (a hypothesis being verified) and must not fabricate results.
# This workflow is directly invocable, independent of the dev agent.

[workflow]
persistent_facts = [
  "file:{project-root}/**/project-context.md",
  "file:{project-root}/docs/bmad/research-methodology.md",
  "file:{project-root}/docs/bmad/development-methodology.md",
]
activation_steps_prepend = [
  "Confirm the methodology manifesto is loaded: read {project-root}/docs/bmad/research-methodology.md if present. If it is missing, stop and tell the user this workflow requires it.",
]
activation_steps_append = [
  "Tie every E2E test to an experiment record under docs/experiments/: the test asserts a falsifiable hypothesis (H-id) with a threshold. Do not fabricate expected values to make a test pass — a test that cannot fail is not a measurement.",
  "KÖPRÜ: Bu skill bagimsiz bir metodoloji kaydi uretmez; E2E test sonuclarini bmad-code-review'in urettigi docs/development/QR-<sira>.md kaydinin 'Mekanik kontroller' bolumune ekler (docs/bmad/dev-skill-to-methodology-bridge.md §1.1 ve §3.1 Faz 3). Eger bagli bir QR kaydi yoksa (bmad-code-review onceden calismadiysa), once onu calistirmayi soyle; bulgulari QR'a besle, ayri kayit acma. Bulgu varsa ilgili QR kaydini guncelle ve native test ciktisina 'Metodoloji kaydi: docs/development/QR-<sira>.md' referansini ekle."
]
