name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  tests:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test deps
        run: python -m pip install pytest

      - name: Run full test suite
        # hooks/engine/tests needs sh-adjacent POSIX tooling on Windows runners,
        # which Git Bash (the default shell there) provides.
        shell: bash
        run: python -m pytest -q

  plugin-health:
    name: plugin health checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test deps
        run: python -m pip install pytest

      - name: Bridge TOML static audit
        run: sh scripts/check-custom.sh

      - name: Plugin structure audit (§0-§6c)
        run: bash scripts/check-plugin.sh

      - name: Tech-debt inventory audit
        run: sh scripts/check-techdebt.sh

      - name: Methodology record format audit
        run: sh scripts/check-methodology.sh
