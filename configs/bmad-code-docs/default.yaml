_base_: ../../bmad_benchmarks/envs/_base_/default.yaml

seed: 42

# laguna-s-2.1:free: couldn't generalize (ders #10)
# deepseek-v4-flash: val 0.778, test 10/10 with decision guides
# mimo-v2.5-free: val 9/9, 0.994 (too easy, nothing to learn)
# groq/qwen/qwen3.6-27b: 400 error (model not found on gateway)
# Qwen2.5-7B-Instruct: first 7 steps skipped (no patches), only 1 accept in 9 steps
# Now trying lc/qwen2.5-14b-instruct with tuned hyperparams.
model:
  target: lc/qwen2.5-14b-instruct
  optimizer: lc/qwen2.5-14b-instruct
  # openai_compatible uses max_tokens (not max_completion_tokens) — gateway needs it
  optimizer_backend: openai_compatible
  target_backend: openai_compatible
  # More tokens for longer, more detailed patches
  rewrite_max_completion_tokens: 8192

env:
  name: bmad-code-docs
  skill_init: bmad_benchmarks/envs/bmad_code_docs/skills/initial.md
  out_root: outputs/bmad-code-docs
  limit: 0
  split_mode: split_dir
  split_dir: bmad_benchmarks/envs/bmad_code_docs/data
  max_completion_tokens: 4096
  # workers=2: serial (1) made each gate eval ~20min (unusable); the 503 spike
  # from parallel calls is now absorbed by the retry guard (drop removed, so the
  # gate always scores the full split). 2 workers roughly halves step time.
  workers: 2

train:
  # batch_size 8: more diverse examples per rollout, helps patch generation
  batch_size: 8
  # 5 epochs: more optimization cycles
  num_epochs: 5

optimizer:
  # edit_budget 5: allow more edits per step (was 3)
  learning_rate: 5

gradient:
  # Bigger merge batch for better aggregation
  merge_batch_size: 8
