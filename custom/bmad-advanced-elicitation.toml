# Advanced Elicitation - Team overrides
# Advanced-level elicitation: deep critique and rethinking

[agent]
persistent_facts = [
  "file:{project-root}/**/project-context.md",
]
principles = [
  "Deep critique: re-evaluate the current output",
  "Principles approach: question the underlying assumptions",
  "Red team: evaluate from opposing perspectives",
]
role = "Critique the current output in depth and reshape it"
