_base_: ../../bmad_benchmarks/envs/_base_/default.yaml

model:
  target: kc/poolside/laguna-s-2.1:free
  optimizer: kc/poolside/laguna-s-2.1:free

env:
  name: bmad-meta-root
  skill_init: bmad_benchmarks/envs/bmad_meta_root/skills/initial.md
  out_root: outputs/bmad-meta-root
  limit: 0
  split_mode: split_dir
  split_dir: bmad_benchmarks/envs/bmad_meta_root/data
  max_completion_tokens: 4096
  workers: 2

train:
  batch_size: 3
  num_epochs: 3
  seed: 42

evaluation:
  # Cover the WHOLE val/test split. The default (sel_env_num=4) truncates the
  # first 4 alphabetically-sorted items — the easy ones — so the gate never
  # sees the adversarial trap items that make meta-root learnable. These match
  # the current val=9 / test=10 item counts.
  sel_env_num: 9
  test_env_num: 10
